[14/10/2026 19:47] MB GABRIEL: name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localiser le projet
        run: |
          P=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          echo "package.json trouve : $P"
          test -n "$P" || { echo "ERREUR: package.json introuvable"; ls -R | head -50; exit 1; }
          echo "PROJ=$(dirname "$P")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: npm install
        working-directory: ${{ env.PROJ }}
        run: npm install
      - name: Ajouter Android
        working-directory: ${{ env.PROJ }}
        run: npx cap add android
      - name: Plein ecran
        working-directory: ${{ env.PROJ }}
        run: bash scripts/patch-android.sh
      - name: Synchroniser
        working-directory: ${{ env.PROJ }}
        run: npx cap sync android
      - name: Icones
        working-directory: ${{ env.PROJ }}
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert www/icon-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
      - name: Compiler l'APK
        working-directory: ${{ env.PROJ }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DriVe-apk
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/app-debug.apk
